name: Workflow security

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - ".github/workflow_security.py"
      - ".github/test_workflow_security.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit-test the scanner
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 .github/test_workflow_security.py -v

      - name: Scan workflows
        shell: bash
        run: python3 .github/workflow_security.py .
