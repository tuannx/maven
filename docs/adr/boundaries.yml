# ADR-0011. Path groups and the reactor direction the rubric gate checks.

path_groups:
  agent-contract:
    - AGENTS.md
    - llms.txt
    - docs/adr/
    - docs/agents/
    - .cursor/skills/
  ci:
    - .github/
  product:
    - api/
    - impl/
    - compat/
    - apache-maven/
    - pom.xml
    - .mvn/

# Reactor tree of the depender, then trees it may depend on.
# api has no outward reactor edge. Nothing depends on the distribution tree.
dependency_direction:
  api:
    - api
  impl:
    - api
    - impl
    - compat
  compat:
    - api
    - impl
    - compat
  apache-maven:
    - api
    - impl
    - compat
    - apache-maven

# A changed workflow may grant scope: write only when the file also contains a marker.
# contents: write is absent here, so it fails the check. ADR-0005.
least_privilege:
  actions:
    - actions/upload-artifact
    - Upload timing logs
  pull-requests:
    - Update sticky pull request comment

# Named by the contract and required to stay absent. ADR-0002.
absent_on_purpose:
  - .mvn/extensions.xml
  - .mvn/maven-build-cache-config.xml
